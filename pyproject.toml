[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "simple-cnn"
version = "0.1.0"
description = "A small, complete PyTorch image classifier: train, evaluate, and predict."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.6,<3",
    "torchvision>=0.21,<1",
    "Pillow>=10,<13",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
cnn-train = "classifier.train:main"
cnn-evaluate = "classifier.evaluate:main"
cnn-predict = "classifier.predict:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
