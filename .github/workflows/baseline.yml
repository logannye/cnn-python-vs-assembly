name: CIFAR-10 baseline

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    strategy:
      fail-fast: false
      matrix:
        seed: [42, 43, 44]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      PYTHONHASHSEED: "0"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU wheels and experiment tools
        run: |
          python -m pip install --only-binary=:all: 'torch>=2.6,<3' 'torchvision>=0.21,<1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev,benchmark]'
      - name: Validate experiment code
        run: |
          ruff check .
          ruff format --check .
          pytest -q
      - name: Train and measure a baseline seed
        run: >-
          cnn-benchmark --data-dir data/cifar10
          --output results/cifar10-baseline
          --seeds ${{ matrix.seed }} --split-seed 1729
          --epochs 10 --batch-size 128 --learning-rate 0.001 --threads 2
      - name: Retain measurements even if a later step fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-seed-${{ matrix.seed }}
          path: results/cifar10-baseline/
          if-no-files-found: warn
          retention-days: 90

  report:
    needs: baseline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install report tools
        run: |
          python -m pip install --only-binary=:all: 'torch>=2.6,<3' 'torchvision>=0.21,<1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[benchmark]'
      - uses: actions/download-artifact@v4
        with:
          pattern: baseline-seed-*
          path: results/seed-runs
      - name: Combine the prespecified seeds
        run: python scripts/collect_baseline.py --inputs results/seed-runs --output results/cifar10-baseline-v1
      - uses: actions/upload-artifact@v4
        with:
          name: cifar10-baseline-v1
          path: results/cifar10-baseline-v1/
          retention-days: 90
